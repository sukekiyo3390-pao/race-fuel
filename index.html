
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163e35">
<title>Race Fuel｜食事管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f3;color:#21362e;font-family:system-ui,sans-serif}
header{background:#163e35;color:white;padding:25px 18px}
header h1{margin:0;font-size:27px}
header p{margin:6px 0 0;font-size:13px;color:#c6ded2}
main{max-width:650px;margin:auto;padding:15px}
.card{background:white;border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 2px 12px #173b2810}
h2{font-size:17px;margin:0 0 14px}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.primary{background:#16785b;color:white;font-weight:bold}
.secondary{background:#eaf1ec;color:#234638}
input,select{padding:11px;border:1px solid #d2ded6;border-radius:10px;min-width:0}
input[type=date]{width:100%}
.row{display:flex;gap:8px;margin-bottom:12px}
.row input{flex:1;width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#edf3ee;color:#244d3c;border:1px solid #d9e6dd;font-size:13px;padding:9px 12px}
.chip.active{background:#16785b;color:white}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #e8eee9}
.item button{padding:6px 10px;font-size:12px}
.muted{color:#77857b;font-size:13px}
.meal{background:#f3f7f4;border-radius:12px;padding:13px;margin-bottom:9px}
.meal b{display:block;margin-bottom:5px}
.status{display:flex;justify-content:space-between;padding:7px 0}
footer{text-align:center;color:#84948a;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>Race Fuel 🏃</h1>
<p>神戸マラソン 2026.11.15｜食事管理</p>
</header>
<main>
<section class="card">
<h2>📅 食事を記録</h2>
<input type="date" id="date">
<p class="muted">食事の時間帯</p>
<div class="chips" id="mealButtons"></div>
<p class="muted">食べたものをタップ</p>
<div class="row">
<input id="search" placeholder="食品を検索・自由入力">
<button class="primary" onclick="addCustom()">追加</button>
</div>
<div class="chips" id="foods"></div>
</section>

<section class="card">
<h2>🍽 記録した食事</h2>
<div id="records"></div>
</section>

<section class="card">
<h2>📊 今日の食事バランス</h2>
<div id="balance"></div>
<p class="muted">食品の種類から推定。量を記録しないため正確な栄養評価ではありません。</p>
</section>

<section class="card">
<h2>✨ 明日のおすすめ献立</h2>
<p id="nextDate" class="muted"></p>
<p id="reason"></p>
<div id="plan"></div>
<button class="secondary" onclick="copyPlan()">献立をコピー</button>
</section>
</main>
<footer>Race Fuel · 食事記録はこのブラウザ内に保存</footer>

<script>
const foodList=[
["白ご飯",["carb"]],["おにぎり",["carb"]],
["食パン",["carb"]],["うどん",["carb"]],
["そば",["carb"]],["パスタ",["carb"]],
["バナナ",["fruit","carb"]],
["りんご",["fruit"]],
["卵",["protein"]],["納豆",["protein"]],
["鶏肉",["protein"]],["焼き魚",["protein"]],
["豚肉",["protein"]],["牛肉",["protein"]],
["豆腐",["protein"]],["ヨーグルト",["protein"]],
["牛乳",["protein"]],["サラダ",["veg"]],
["温野菜",["veg"]],["味噌汁",["veg"]],
["二郎系ラーメン",["carb","protein","heavy"]],
["ラーメン",["carb","heavy"]],
["マクドナルド",["carb","heavy"]],
["ハンバーガー",["carb","protein","heavy"]],
["ポテト",["carb","heavy"]],
["唐揚げ",["protein","heavy"]],
["牛丼",["carb","protein"]],
["親子丼",["carb","protein"]],
["カレーライス",["carb","heavy"]],
["菓子パン",["carb","heavy"]],
["カステラ",["carb"]],
["スポーツドリンク",["carb"]],
["補給ジェル",["carb"]]
];

const $=id=>document.getElementById(id);
let activeMeal="朝食";
let data={};
try{
 data=JSON.parse(localStorage.getItem("racefuel-data")||"{}");
}catch(e){data={};}

const now=new Date();
$("date").value=new Date(
 now.getTime()-now.getTimezoneOffset()*60000
).toISOString().slice(0,10);

const mealTypes=["朝食","昼食","夕食","間食"];

function save(){
 try{
  localStorage.setItem("racefuel-data",JSON.stringify(data));
 }catch(e){
  alert("保存できませんでした");
 }
}

function getRecords(){
 const d=$("date").value;
 if(!data[d])data[d]=[];
 return data[d];
}

function addFood(name){
 name=name.trim();
 if(!name)return;
 getRecords().push({name,meal:activeMeal});
 save();
 $("search").value="";
 render();
}

function addCustom(){
 addFood($("search").value);
}

function removeFood(index){
 getRecords().splice(index,1);
 save();
 render();
}

function getTags(name){
 const f=foodList.find(x=>x[0]===name);
 return f?f[1]:[];
}

function renderMealButtons(){
 $("mealButtons").innerHTML="";
 mealTypes.forEach(m=>{
  const b=document.createElement("button");
  b.className="chip"+(m===activeMeal?" active":"");
  b.textContent=m;
  b.onclick=()=>{
   activeMeal=m;
   render();
  };
  $("mealButtons").appendChild(b);
 });
}

function renderFoods(){
 $("foods").innerHTML="";
 const query=$("search").value.toLowerCase();
 foodList.filter(f=>f[0].includes(query)).forEach(f=>{
  const b=document.createElement("button");
  b.className="chip";
  b.textContent="＋ "+f[0];
  b.onclick=()=>addFood(f[0]);
  $("foods").appendChild(b);
 });
}

function renderRecords(){
 $("records").innerHTML="";
 const records=getRecords();
 if(!records.length){
  $("records").textContent="まだ記録がありません";
  return;
 }
 records.forEach((r,i)=>{
  const div=document.createElement("div");
  div.className="item";
  const span=document.createElement("span");
  span.textContent=r.meal+"： "+r.name;
  const b=document.createElement("button");
  b.className="secondary";
  b.textContent="削除";
  b.onclick=()=>removeFood(i);
  div.append(span,b);
  $("records").appendChild(div);
 });
}

function renderBalance(){
 const records=getRecords();
 const tags=records.flatMap(r=>getTags(r.name));
 const categories=[
  ["主食","carb"],
  ["タンパク質","protein"],
  ["野菜","veg"],
  ["果物","fruit"]
 ];
 $("balance").innerHTML="";
 categories.forEach(([label,key])=>{
  const div=document.createElement("div");
  div.className="status";
  const a=document.createElement("span");
  a.textContent=label;
  const b=document.createElement("span");
  b.textContent=tags.includes(key)?"✓ 記録あり":"— 記録なし";
  div.append(a,b);
  $("balance").appendChild(div);
 });
}

let planText="";

function renderPlan(){
 const records=getRecords();
 const tags=records.flatMap(r=>getTags(r.name));
 const has=x=>tags.includes(x);
 const heavy=has("heavy");

 const next=new Date($("date").value+"T12:00:00");
 next.setDate(next.getDate()+1);
 const d=next.getFullYear()+"-"+
 String(next.getMonth()+1).padStart(2,"0")+"-"+
 String(next.getDate()).padStart(2,"0");

 $("nextDate").textContent=d;

 let plan,reason;

 if(d==="2026-11-15"){
  reason="レース当日。消化しやすく、練習で試した食品を優先。";
  plan=[
   ["朝食","おにぎり、バナナ、カステラ"],
   ["スタート前","必要に応じて補給ジェル"],
   ["レース中","補給ジェル、スポーツドリンク、水"],
   ["ゴール後","おにぎり、鶏肉、汁物"]
  ];
 }else if(d>="2026-11-12"&&d<="2026-11-14"){
  reason="カーボローディング期。糖質を優先し、脂質と食物繊維を控えめに。";
  plan=[
   ["朝食","白ご飯、卵、バナナ"],
   ["昼食","うどん、おにぎり、鶏肉"],
   ["夕食","白ご飯、鶏肉、スープ"],
   ["間食","カステラ、あんパン、スポーツドリンク"]
  ];
 }else if(d>="2026-11-09"&&d<="2026-11-11"){
  reason="糖質を増やし始める時期。主食を毎食確保。";
  plan=[
   ["朝食","白ご飯、納豆、卵、バナナ"],
   ["昼食","親子丼、味噌汁"],
   ["夕食","白ご飯、焼き魚、温野菜"],
   ["間食","おにぎり、ヨーグルト"]
  ];
 }else{
  reason=!records.length?
   "食事を入力すると献立が調整されます。":
   heavy?
   "脂っこい外食があったので、明日は定食中心に。":
   !has("veg")?
   "野菜の記録がないので、明日は野菜を取り入れよう。":
   !has("protein")?
   "タンパク質を含む食品を意識しよう。":
   "主食とおかずのバランスを維持しよう。";

  plan=[
   ["朝食","白ご飯、納豆、卵、"+
    (!has("fruit")?"バナナ":"ヨーグルト")],
   ["昼食",heavy?"焼き魚定食、味噌汁":
    "鶏肉定食、サラダ"],
   ["夕食",heavy?"白ご飯、鶏むね肉、温野菜":
    "白ご飯、鮭、温野菜"],
   ["間食","バナナ、ヨーグルト"]
  ];
 }

 $("reason").textContent=reason;
 $("plan").innerHTML="";
 plan.forEach(([title,food])=>{
  const div=document.createElement("div");
  div.className="meal";
  const b=document.createElement("b");
  b.textContent=title;
  const p=document.createElement("span");
  p.textContent=food;
  div.append(b,p);
  $("plan").appendChild(div);
 });

 planText=d+"\n"+
 plan.map(x=>x[0]+"： "+x[1]).join("\n");
}

function copyPlan(){
 if(navigator.clipboard){
  navigator.clipboard.writeText(planText)
   .then(()=>alert("献立をコピーしました"))
   .catch(()=>alert("コピーできませんでした"));
 }
}

function render(){
 renderMealButtons();
 renderFoods();
 renderRecords();
 renderBalance();
 renderPlan();
}

$("search").addEventListener("input",renderFoods);
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")addCustom();
});
$("date").addEventListener("change",render);

render();
</script>
</body>
</html>
